openapi: 3.0.0
info:
  title: 'UTP Scholarship System API'
  description: 'REST API for the UTP Scholarship & Course Eligibility System.'
  contact:
    name: 'UTP Engineering'
    email: engineering@utp.edu.my
  version: 1.0.0
paths:
  /api/check-eligibility.php:
    post:
      tags:
        - Eligibility
      summary: 'Check programme eligibility'
      description: 'Saves qualification and grades, runs the AI recommendation engine, creates an application record, and returns programme eligibility results.'
      operationId: a1aab7366e5715d4180da7b3e3445df7
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - csrf_token
                - qual_type
                - 'subjects[]'
                - 'grades[]'
              properties:
                csrf_token:
                  description: 'CSRF protection token'
                  type: string
                qual_type:
                  description: "Student's qualification type"
                  type: string
                  enum: [SPM, O-Level, IGCSE]
                'subjects[]':
                  description: 'Array of subject names'
                  type: array
                  items: { type: string }
                'grades[]':
                  description: 'Array of letter grades'
                  type: array
                  items: { type: string }
              type: object
      responses:
        '200':
          description: 'Eligibility check completed'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean }
                  redirect: { type: string, example: /student/results.php }
                type: object
        '400':
          description: 'Validation error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Not authenticated or email not verified'
        '500':
          description: 'AI engine or database error'
      security:
        -
          sessionAuth: []
      servers:
        -
          url: 'http://localhost:8080'
          description: 'Local development'
        -
          url: 'https://scholarship.utp.edu.my'
          description: Production
  /api/submit-application.php:
    post:
      tags:
        - Applications
      summary: 'Submit scholarship application'
      description: 'Updates an existing application with 3 chosen programme preferences and an optional scholarship selection.'
      operationId: 67d41b794dc5f9c7d2abfe6f066b656b
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - csrf_token
                - app_id
                - programme_id_1
                - programme_id_2
                - programme_id_3
              properties:
                csrf_token:
                  type: string
                app_id:
                  type: integer
                programme_id_1:
                  type: integer
                programme_id_2:
                  type: integer
                programme_id_3:
                  type: integer
                scholarship_id:
                  type: integer
                  nullable: true
              type: object
      responses:
        '200':
          description: 'Application submitted'
        '400':
          description: 'Validation error'
        '403':
          description: 'Not authenticated'
        '500':
          description: 'Server error'
      security:
        -
          sessionAuth: []
      servers:
        -
          url: 'http://localhost:8080'
          description: 'Local development'
        -
          url: 'https://scholarship.utp.edu.my'
          description: Production
  /api/logout.php:
    post:
      tags:
        - Authentication
      summary: 'Logout and destroy session'
      operationId: eaaaa83dd7298c3480beeb339527f1af
      responses:
        '302':
          description: 'Redirect to /auth/login.php'
      servers:
        -
          url: 'http://localhost:8080'
          description: 'Local development'
        -
          url: 'https://scholarship.utp.edu.my'
          description: Production
  /api/export-audit-csv.php:
    get:
      tags:
        - Admin
      summary: 'Export audit log as CSV'
      operationId: d07c13e6a97294e697710f61d10f225f
      parameters:
        -
          name: date_from
          in: query
          schema:
            type: string
            format: date
        -
          name: date_to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 'CSV file download'
        '400':
          description: 'Invalid date format'
        '403':
          description: 'Admin role required'
      security:
        -
          sessionAuth: []
      servers:
        -
          url: 'http://localhost:8080'
          description: 'Local development'
        -
          url: 'https://scholarship.utp.edu.my'
          description: Production
components:
  schemas:
    ErrorResponse:
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: 'Please select a valid qualification type.'
      type: object
  securitySchemes:
    sessionAuth:
      type: apiKey
      description: 'PHP session cookie'
      name: PHPSESSID
      in: cookie
tags:
  -
    name: Eligibility
    description: Eligibility
  -
    name: Applications
    description: Applications
  -
    name: Authentication
    description: Authentication
  -
    name: Admin
    description: Admin
