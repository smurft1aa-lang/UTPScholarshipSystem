# ─────────────────────────────────────────────────────────────
# CI Pipeline — UTP Scholarship System
# Triggers on push to main/newf and on pull requests to main.
#
# Jobs:
#   lint          → PHP CodeSniffer (PSR-12) + PHPStan
#   test          → PHPUnit with code coverage gate (80%)
#   security-scan → Grep-based SQL injection & XSS detection
#   docker-build  → Validates Docker image builds successfully
#
# After all jobs, a summary is posted as a PR comment.
# ─────────────────────────────────────────────────────────────

name: CI Pipeline

on:
  push:
    branches: [main, newf]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════
  # JOB 1: Code Linting & Static Analysis
  # ═══════════════════════════════════════════════════════════
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, fileinfo
          tools: cs2pr  # Converts phpcs output to GitHub annotations

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist

      # PHP CodeSniffer: enforce PSR-12 coding standard
      - name: Run PHP CodeSniffer (PSR-12)
        run: |
          vendor/bin/phpcs --standard=phpcs.xml --report=checkstyle --report-file=phpcs-report.xml || true
          vendor/bin/phpcs --standard=phpcs.xml --report=summary || true
        continue-on-error: false

      # PHPStan: static type analysis
      - name: Run PHPStan static analysis
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

      # Tech Debt Check: Warn on legacy bridge files
      - name: Check for deprecated legacy bridge files (Q3 2026 Target)
        run: |
          echo "🔍 Checking for deprecated procedural bridge files..."
          ISSUES=0
          if grep -rn --include="*.php" "includes/ai_engine.php" --exclude-dir=vendor --exclude-dir=tests .; then
            echo "::warning::Found includes of deprecated includes/ai_engine.php. Please migrate to \UTP\Services\AIEngine."
            ISSUES=$((ISSUES + 1))
          fi
          if grep -rn --include="*.php" "GradeMapper.php" --exclude-dir=vendor --exclude-dir=tests .; then
            echo "::warning::Found includes of deprecated GradeMapper.php. Please migrate to OOP \UTP\Services\GradeMapper."
            ISSUES=$((ISSUES + 1))
          fi
          if [ $ISSUES -eq 0 ]; then
            echo "✅ No legacy bridge file includes detected! Great job."
          fi

      - name: Verify OpenAPI Spec is in sync
        run: |
          vendor/bin/openapi src -o docs/openapi.yaml
          git diff --exit-code docs/openapi.yaml || { echo "::error::OpenAPI spec is out of sync. Run 'vendor/bin/openapi src -o docs/openapi.yaml' and commit the changes."; exit 1; }

  # ═══════════════════════════════════════════════════════════
  # JOB 2: PHPUnit Tests + Code Coverage
  # ═══════════════════════════════════════════════════════════
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest

    services:
      # MySQL service for migration testing
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: utp_scholarship_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptesting"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2 with PCOV
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, fileinfo, pcov
          coverage: pcov

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist

      # Step 1: Run tests and dump raw coverage data (serialized PHP)
      - name: Run PHPUnit tests with coverage
        run: |
          php -d pcov.enabled=1 -d memory_limit=512M vendor/bin/phpunit \
            --colors=always \
            --coverage-php coverage-data.php
          echo "Coverage data file:"
          ls -la coverage-data.php
        env:
          APP_ENV: testing
          APP_KEY: ci-test-key-for-encryption-123

      # Step 2: Convert serialized coverage to Clover XML
      - name: Generate Clover coverage report
        run: php scripts/convert-coverage.php coverage-data.php coverage.xml

      # Step 3: Enforce minimum 80% code coverage
      - name: Check code coverage gate (80% minimum)
        run: php scripts/check_coverage.php coverage.xml 80
        env:
          APP_ENV: testing

      # Test that Phinx migrations apply cleanly against real MySQL
      - name: Test database migrations
        run: |
          vendor/bin/phinx migrate -e testing --configuration=phinx.php 2>&1
          echo "Migration test completed"
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: utp_scholarship_test
          DB_USER: root
          DB_PASS: testing

      # Upload HTML coverage report as artifact
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════
  # JOB 3: Security Scanning
  # ═══════════════════════════════════════════════════════════
  security-scan:
    name: Security Scan (Taint Analysis)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, fileinfo

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run Psalm Taint Analysis
        run: vendor/bin/psalm --taint-analysis --report=psalm-report.xml

      - name: Check Composer audit
        run: composer audit --no-interaction || true

  # ═══════════════════════════════════════════════════════════
  # JOB 4: Docker Build Validation
  # ═══════════════════════════════════════════════════════════
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Ensure .env.example documents all required environment variables
      - name: Validate .env.example completeness
        run: |
          REQUIRED_VARS="DB_HOST DB_NAME DB_USER DB_PASS GEMINI_API_KEY APP_ENV"
          MISSING=""
          for var in $REQUIRED_VARS; do
            if ! grep -q "^${var}=" .env.example 2>/dev/null; then
              MISSING="$MISSING $var"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "❌ .env.example is missing required variables:$MISSING"
            exit 1
          fi
          echo "✅ .env.example contains all required variables"

      # Validate Dockerfile builds without errors
      - name: Build Docker image
        run: docker build --target production -t utp-scholarship:ci-test .

      # Verify the container starts and Apache responds
      - name: Smoke test container
        run: |
          docker run -d --name ci-test \
            -e DB_HOST=localhost \
            -e DB_NAME=test \
            -e DB_USER=root \
            -e DB_PASS=test \
            -e APP_ENV=testing \
            utp-scholarship:ci-test

          # Verify container started (fail if it didn't)
          if ! docker ps --filter name=ci-test --filter status=running | grep -q ci-test; then
            echo "❌ Container failed to start"
            docker logs ci-test 2>&1
            exit 1
          fi

          # Give Apache 5 seconds to start
          sleep 5

          # Check container is running (may fail due to no DB — that's OK)
          docker ps -a --filter name=ci-test
          docker logs ci-test 2>&1 | tail -20

          # Cleanup
          docker stop ci-test || true
          docker rm ci-test || true

          echo "✅ Docker build and startup validated"

  # ═══════════════════════════════════════════════════════════
  # POST-RUN: PR Comment with Results Summary
  # ═══════════════════════════════════════════════════════════
  pr-comment:
    name: Post Results
    runs-on: ubuntu-latest
    needs: [lint, test, security-scan, docker-build]
    if: github.event_name == 'pull_request' && always()

    permissions:
      pull-requests: write

    steps:
      - name: Post PR comment with CI summary
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = {
              lint: '${{ needs.lint.result }}',
              test: '${{ needs.test.result }}',
              'security-scan': '${{ needs.security-scan.result }}',
              'docker-build': '${{ needs.docker-build.result }}'
            };

            const icon = (status) => status === 'success' ? '✅' : status === 'failure' ? '❌' : '⚠️';
            const allPassed = Object.values(jobs).every(s => s === 'success');

            let body = `## ${allPassed ? '✅' : '❌'} CI Pipeline Results\n\n`;
            body += `| Job | Status |\n|-----|--------|\n`;
            for (const [name, status] of Object.entries(jobs)) {
              body += `| ${name} | ${icon(status)} ${status} |\n`;
            }
            body += `\n---\n`;
            body += `*Commit: \`${context.sha.substring(0, 7)}\` · Run: [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
